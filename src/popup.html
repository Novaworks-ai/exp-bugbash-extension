<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bug Bash Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Bug Bash</span>
      <span class="version-badge" id="version-badge">v0.2.0</span>
    </div>
    <div class="connect-status hidden" id="connect-status">
      <span class="dot dot-off" id="connect-dot"></span>
      <span id="connect-label">Not connected</span>
    </div>
  </header>

  <!-- Shown until a service is configured and (if it requires it) signed
       into. This is the only path to getting connected — no separate
       Settings form to hunt for first. -->
  <main class="gate" id="gate">
    <section class="gate-step" id="gate-step-url">
      <label class="field-label" for="gate-backend-url">Where's your bug-bash intake service?</label>
      <input type="text" id="gate-backend-url" placeholder="https://bugbash.example.com" />
      <p class="hint">Ask whoever is running this bug bash for the URL.</p>
      <button class="primary-btn" id="btn-gate-continue">Continue</button>
      <div class="status hidden" id="gate-url-status"></div>
    </section>

    <section class="gate-step hidden" id="gate-step-login">
      <p class="hint" id="gate-service-label"></p>
      <button class="primary-btn" id="btn-gate-signin">Sign in with Microsoft</button>
      <button class="link-btn" id="btn-gate-change-service">Use a different service</button>
      <div class="status hidden" id="gate-login-status"></div>
    </section>
  </main>

  <div id="app-shell" class="hidden">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="capture">Capture</button>
      <button class="tab" data-tab="queue">Queue</button>
      <button class="tab" data-tab="history">History</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>

    <main class="panels">
      <section class="panel active" id="panel-capture">
        <div id="capture-idle">
          <button class="primary-btn" id="btn-capture">Capture this page</button>
          <p class="hint">Grabs a screenshot of the visible tab, then add a description.</p>
        </div>

        <div id="capture-preview" class="hidden">
          <img id="preview-img" alt="Screenshot preview" />
          <label class="field-label" for="description">What's wrong?</label>
          <textarea id="description" rows="4" placeholder="Describe the bug you saw..."></textarea>
          <div class="page-meta" id="page-meta"></div>
          <div class="row">
            <button class="secondary-btn" id="btn-retake">Retake</button>
            <button class="primary-btn" id="btn-submit">Submit</button>
          </div>
        </div>

        <div id="capture-status" class="status hidden"></div>
      </section>

      <section class="panel" id="panel-queue">
        <div class="panel-toolbar">
          <span class="panel-title">Open items</span>
          <button class="link-btn" id="btn-refresh-queue">Refresh</button>
        </div>
        <ul class="item-list" id="queue-list"></ul>
        <p class="empty-hint hidden" id="queue-empty">Nothing open. Submit a capture to get started.</p>
      </section>

      <section class="panel" id="panel-history">
        <div class="panel-toolbar">
          <span class="panel-title">Resolved</span>
          <button class="link-btn" id="btn-refresh-history">Refresh</button>
        </div>
        <ul class="item-list" id="history-list"></ul>
        <p class="empty-hint hidden" id="history-empty">No resolved items yet.</p>
      </section>

      <section class="panel" id="panel-detail">
        <button class="link-btn" id="btn-detail-back">‹ Back</button>
        <div class="detail-desc" id="detail-description"></div>
        <div class="page-meta" id="detail-meta"></div>
        <div class="detail-status" id="detail-status-row"></div>

        <div id="detail-resolution" class="status hidden"></div>

        <div id="detail-clarifications"></div>

        <div id="detail-answer-box" class="hidden">
          <label class="field-label" for="detail-answer">Open question</label>
          <p class="hint" id="detail-question"></p>
          <textarea id="detail-answer" rows="3" placeholder="Your answer..."></textarea>
          <button class="primary-btn" id="btn-detail-answer-submit">Send answer</button>
        </div>
        <div class="status hidden" id="detail-status"></div>
      </section>

      <section class="panel" id="panel-settings">
        <label class="field-label">Intake service</label>
        <div class="page-meta" id="settings-backend-url-display"></div>
        <p class="hint" id="settings-auth-mode"></p>

        <div class="row">
          <button class="secondary-btn" id="btn-sign-out">Sign out</button>
          <button class="secondary-btn" id="btn-change-service">Change service</button>
        </div>
        <div class="status hidden" id="settings-status"></div>
      </section>
    </main>
  </div>

  <script src="settings.js"></script>
  <script src="oauth.js"></script>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
