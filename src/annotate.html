<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Annotate screenshot — Bug Bash Capture</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #181611;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: #181611;
        color: #fff;
        flex: none;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      header p {
        margin: 2px 0 0;
        font-size: 11px;
        color: #b8b3a6;
      }
      header code {
        color: #ffbd8a;
      }
      .canvas-area {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 16px;
      }
      #annotate-canvas {
        max-width: 100%;
        max-height: 100%;
        border: 1px solid #dcd5c6;
        border-radius: 6px;
        background: #fff;
        cursor: crosshair;
        touch-action: none;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 16px;
        background: #fff;
        border-top: 1px solid #dcd5c6;
        flex: none;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .secondary-btn {
        background: #fff;
        border-color: #dcd5c6;
        color: #181611;
      }
      .secondary-btn:hover {
        background: #f0ede4;
      }
      .primary-btn {
        background: #4f46e4;
        color: #fff;
      }
      .primary-btn:hover {
        background: #4038c7;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Draw on the screenshot</h1>
        <p>Pinned element: <code id="annotate-selector">(none)</code></p>
      </div>
    </header>
    <div class="canvas-area">
      <canvas id="annotate-canvas"></canvas>
    </div>
    <footer>
      <button class="secondary-btn" id="btn-annotate-clear">Clear drawing</button>
      <button class="secondary-btn" id="btn-annotate-cancel">Cancel</button>
      <button class="primary-btn" id="btn-annotate-use">Use this</button>
    </footer>
    <script src="annotate.js"></script>
  </body>
</html>
