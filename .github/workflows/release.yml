name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest.json version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r .version manifest.json)"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Build extension zip
        run: |
          zip_name="bug-bash-capture-${GITHUB_REF_NAME}.zip"
          # manifest.json's "key" is pinned to the actual published Web Store item's
          # public key (extracted from its live .crx), so it matches on upload and
          # also keeps unpacked/dev loads on the same extension ID/OAuth redirect URI.
          zip -r "$zip_name" manifest.json src icons -x "**/.DS_Store"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_name="bug-bash-capture-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip_name" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip_name" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
